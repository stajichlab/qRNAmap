[workspace]
name = "qrnamap"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# Rust toolchain and the WASM target. The std package version must equal the rust version.
rust = ">=1.96,<2"
rust-std-wasm32-unknown-unknown = ">=1.96,<2"
kallisto = "==0.52.0"
hisat2 = "==2.2.2"
subread = "==2.1.1"
gffread = "*"
zstd = "*"
python = ">=3.11"
pytest = "*"
r-base = "*"
bioconductor-deseq2 = "==1.50.2"

[tasks]
# QRNAMAP_REQUIRE_TOOLS=1 makes tool-dependent tests fail instead of skip.
test = { cmd = "cargo test --workspace", env = { QRNAMAP_REQUIRE_TOOLS = "1" } }
# The three pure crates must build for WASM.
wasm-check = "cargo build -p qseq-io -p genome-catalog -p qrnamap-core --target wasm32-unknown-unknown"

[workspace]
name = "qrnamap"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# Rust toolchain and the WASM target. The std package version must equal the rust version.
rust = ">=1.96,<2"
rust-std-wasm32-unknown-unknown = ">=1.96,<2"
# The `wasm-bindgen` CLI version must equal the `wasm-bindgen` version in Cargo.lock.
wasm-bindgen-cli = "==0.2.130"
# Runs the WASM package in tests (same V8 engine as Chrome).
nodejs = ">=22,<23"
kallisto = "==0.52.0"
salmon = "==2.8.0"
hisat2 = "==2.2.2"
subread = "==2.1.1"
gffread = "*"
zstd = "*"
python = ">=3.11"
pytest = "*"
r-base = "*"
bioconductor-deseq2 = "==1.50.2"
bioconductor-apeglm = "*"
r-ashr = "*"

[tasks]
# QRNAMAP_REQUIRE_TOOLS=1 makes tool-dependent tests fail instead of skip.
test = { cmd = "cargo test --workspace", env = { QRNAMAP_REQUIRE_TOOLS = "1" } }
# The three pure crates must build for WASM.
wasm-check = "cargo build -p qseq-io -p genome-catalog -p qrnamap-core --target wasm32-unknown-unknown"
# Build the WebAssembly package for browsers (pkg-web) or for Node (pkg-node).
build-wasm-web = "bash scripts/build-wasm-pkg.sh web pkg-web"
build-wasm-node = "bash scripts/build-wasm-pkg.sh nodejs pkg-node"
# Assemble the static site in dist-site/ (needs pkg-web: run build-wasm-web first).
build-site = "bash scripts/build-site.sh"
# The web package, the site and the CLI with the site embedded in it.
build-cli = "bash scripts/build-wasm-pkg.sh web pkg-web && bash scripts/build-site.sh && cargo build --release -p qrnamap-cli"
# Check that the WASM build gives the same files as the native CLI.
test-wasm = "bash scripts/test-wasm.sh"

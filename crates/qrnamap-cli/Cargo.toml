[package]
name = "qrnamap-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qrnamap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
qrnamap-core = { path = "../qrnamap-core" }
qseq-io = { path = "../qseq-io" }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

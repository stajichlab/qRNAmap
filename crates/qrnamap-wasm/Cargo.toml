[package]
name = "qrnamap-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qseq-io = { path = "../qseq-io" }
genome-catalog = { path = "../genome-catalog" }
qrnamap-core = { path = "../qrnamap-core" }
# Must equal the wasm-bindgen-cli version in pixi.toml (the CLI and the library must match).
wasm-bindgen = "=0.2.130"
serde_json = "1"

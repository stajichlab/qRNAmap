[package]
name = "qrnamap-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrnamap-core = { path = "../../crates/qrnamap-core" }

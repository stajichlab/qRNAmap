[package]
name = "qrnamap-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
name = "qrnamap_desktop"
path = "src/lib.rs"

[[bin]]
name = "qrnamap-desktop"
path = "src/main.rs"

# The desktop app is a workspace of its own. It must not join the root workspace: the root
# workspace is built on machines without the Tauri system libraries (webkit2gtk on Linux), and its
# Cargo.lock would then carry the whole Tauri dependency tree for every other crate.
[workspace]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3"
qrnamap-core = { path = "../../crates/qrnamap-core" }
qrnamap-cli = { path = "../../crates/qrnamap-cli" }
tempfile = "3"
flate2 = "1"
rfd = "0.15"

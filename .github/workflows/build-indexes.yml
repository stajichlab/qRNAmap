name: Build and Release Fungal Kallisto Indexes

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for index assets (e.g. indexes-v1)'
        required: true
        default: 'indexes-v1'
      limit:
        description: 'Number of genomes to build (0 for all 50)'
        required: false
        default: '50'

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      genomes: ${{ steps.list.outputs.genomes }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate matrix
        id: list
        run: |
          python3 -c "
          import json, os
          with open('crates/genome-catalog/data/indexes-manifest-targets.json') as f:
              targets = json.load(f)
          limit = int(os.environ.get('LIMIT', '50'))
          if limit > 0:
              targets = targets[:limit]
          matrix_entries = []
          for g in targets:
              matrix_entries.append({
                  'accession': g['accession'],
                  'organism': g['organism'],
                  'fna_url': g['fasta']['url'],
                  'gff_url': g['gff']['url']
              })
          print('genomes=' + json.dumps(matrix_entries))
          " >> $GITHUB_OUTPUT
        env:
          LIMIT: ${{ github.event.inputs.limit }}

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
      - name: Build qrnamap CLI
        run: cargo build --release -p qrnamap-cli
      - name: Upload CLI
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qrnamap-bin
          path: target/release/qrnamap

  build:
    needs: [matrix, build-cli]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        genome: ${{ fromJson(needs.matrix.outputs.genomes) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true

      - name: Download CLI
        uses: actions/download-artifact@v8.0.2
        with:
          name: qrnamap-bin
          path: bin

      - name: Build Index for ${{ matrix.genome.accession }} (${{ matrix.genome.organism }})
        run: |
          chmod +x bin/qrnamap
          export PATH="$PWD/bin:$PATH"
          mkdir -p artifacts
          pixi run bash scripts/build-one-index.sh \
            "${{ matrix.genome.accession }}" \
            "${{ matrix.genome.fna_url }}" \
            "${{ matrix.genome.gff_url }}" \
            artifacts

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: index-${{ matrix.genome.accession }}
          path: artifacts/*
          retention-days: 7

  release:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download all built artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Consolidate Manifest and Checksums
        run: |
          mkdir -p release-files
          mv all-artifacts/* release-files/ || true
          cd release-files
          # The qrnamap CLI artifact is downloaded with the indexes; it is a build tool, not a release asset.
          rm -f qrnamap
          # Every accession needs all four files (a missing one makes the page fall back to building the index).
          for f in ./*.idx.gz; do acc=$(basename "$f" .idx.gz)
            for k in tx2gene.tsv gene_info.tsv genes.tsv; do [ -f "$acc.$k.gz" ] || { echo "missing $acc.$k.gz" >&2; exit 1; }; done
          done
          # One <accession>.sha256 per genome (build-one-index.sh): join them into one list.
          cat ./*.sha256 | sort -u -k2 > checksums.all && rm -f ./*.sha256 && mv checksums.all checksums.sha256
          sha256sum --check --quiet checksums.sha256
          ls -lh
          echo "Total size: $(du -sh .)"

      - name: Publish or Update GitHub Release
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          TITLE="Pre-built Kallisto Fungal Indexes (${TAG})"
          BODY="Automated pre-computed kallisto (k=31) indexes and transcript annotations for 50 fungal genomes. Serves web/desktop qRNAmap without requiring client-side indexing."
          # Create or verify release
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "$BODY"
          fi
          # Upload files one by one with retry to avoid GitHub API 500 on burst uploads
          cd release-files
          for f in *; do
            [ -f "$f" ] || continue
            echo "Uploading $f..."
            ok=0
            for attempt in {1..5}; do
              if gh release upload "$TAG" "$f" --clobber; then
                ok=1; break
              fi
              echo "Upload failed for $f, retrying in 3s (attempt $attempt/5)..."
              sleep 3
            done
            [ "$ok" = 1 ] || { echo "giving up on $f: the release would miss it" >&2; exit 1; }
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Browser page (version 1) checks in headless Playwright browsers.
# Job `measure` (Task 3 of docs/superpowers/plans/2026-11-22-browser-page-v1.md): the measurements that fix the page limits.
# See docs/browser/page-v1-measurements.md for the method and the results.
# No secrets. Public data only: reads from ENA, genomes from NCBI, transcripts from the spike 0 fixture release.
name: Browser page
on:
  push:
    branches: [page-v1]
    paths:
      - 'validation/browser-page/**'
      - '!validation/browser-page/measure/results/**'
      - '.github/workflows/page.yml'
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma list: quant, truncated, genomes'
        required: false
        default: 'quant,truncated,genomes'
      counts:
        description: 'Read pairs per quant run (comma list, ascending)'
        required: false
        default: '100000,200000,500000,1000000,2000000,3000000,4000000,6000000,8405534'
      reps:
        description: 'Runs per case'
        required: false
        default: '3'
permissions:
  contents: read
concurrency:
  group: page-${{ github.ref }}
  cancel-in-progress: false
# A push has no inputs: it runs a short check (2 counts, 1 run per case). The full measurement runs on dispatch.
env:
  SUITES: ${{ inputs.suites || 'quant,truncated,genomes' }}
  COUNTS: ${{ inputs.counts || '100000,200000' }}
  REPS: ${{ inputs.reps || '1' }}

# Action versions are pinned to exact tags (checkout and setup-pixi as in pages.yml; the others checked on 2026-11-22).
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          suites = [s.strip() for s in os.environ['SUITES'].split(',') if s.strip()]
          inc = []
          if 'quant' in suites:
              inc += [{'suite': 'quant', 'engine': e, 'mode': m} for e in ['node', 'chromium', 'firefox', 'webkit'] for m in ['gz', 'plain']]
          if 'truncated' in suites:
              inc += [{'suite': 'truncated', 'engine': e, 'mode': '-'} for e in ['chromium', 'firefox', 'webkit']]
          if 'genomes' in suites:
              inc += [{'suite': 'genomes', 'engine': e, 'mode': '-'} for e in ['node', 'chromium', 'firefox', 'webkit']]
          print('matrix=' + json.dumps({'include': inc}))
          EOF

  wasm-pkg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          locked: true
          cache: true
      - run: pixi run build-wasm-web
      - run: pixi run build-wasm-node
      - name: Vendor check (site/vendor/kallisto against PROVENANCE.md)
        run: bash scripts/check-vendor.sh "$PWD/site/vendor/kallisto"
      - run: sha256sum pkg-web/* pkg-node/* | tee pkg.sha256 && mv pkg.sha256 pkg-web/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: measure-pkg
          path: |
            pkg-web/
            pkg-node/
          retention-days: 7

  reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download SRR3396381 from ENA and the yeast transcripts; check MD5, read counts, SHA-256
        run: bash validation/browser-page/measure/prepare_reads.sh data/reads
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: measure-reads
          path: data/reads/
          compression-level: 0
          retention-days: 3

  genome-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download the genomes from NCBI (timed)
        run: python3 -I validation/browser-page/measure/prepare_genomes.py crates/genome-catalog/data/genomes.json data/genomes
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: measure-genomes
          path: data/genomes/
          compression-level: 0
          retention-days: 3

  measure:
    needs: [plan, wasm-pkg, reads, genome-data]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: validation/browser-page/measure/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: validation/browser-page/measure
      - name: Install the Playwright browser
        if: matrix.engine != 'node'
        working-directory: validation/browser-page/measure
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: measure-pkg
          path: .
      - uses: actions/download-artifact@v8.0.2
        if: matrix.suite != 'genomes'
        with:
          name: measure-reads
          path: data/reads
      - uses: actions/download-artifact@v8.0.2
        if: matrix.suite == 'genomes'
        with:
          name: measure-genomes
          path: data/genomes
      - name: Runner facts
        run: |
          out=reports/${{ matrix.suite }}-${{ matrix.engine }}-${{ matrix.mode }}
          mkdir -p "$out"
          { date -u +%Y-%m-%dT%H:%M:%SZ; uname -a; nproc; free -k; grep -E 'MemTotal|SwapTotal' /proc/meminfo; node --version; cat /etc/os-release | head -2; } | tee "$out/runner.txt"
          cp pkg-web/pkg.sha256 "$out/"
          if [ -f data/reads/reads_check.tsv ]; then cp data/reads/reads_check.tsv data/reads/sha256.txt "$out/"; fi
          if [ -f data/genomes/download.tsv ]; then cp data/genomes/download.tsv data/genomes/genomes.tsv "$out/"; fi
      - name: Run (${{ matrix.suite }}, ${{ matrix.engine }}, ${{ matrix.mode }})
        run: |
          set -o pipefail
          out=reports/${{ matrix.suite }}-${{ matrix.engine }}-${{ matrix.mode }}
          case "${{ matrix.suite }}" in
            quant) extra=(--data data/reads --counts "$COUNTS" --modes "${{ matrix.mode }}" --budget-min 300) ;;
            truncated) extra=(--data data/reads) ;;
            genomes)
              pkg=pkg-web; [ "${{ matrix.engine }}" = node ] && pkg=pkg-node
              extra=(--data data/genomes --genomes data/genomes/genomes.tsv --pkg "$pkg") ;;
          esac
          node validation/browser-page/measure/measure.mjs --suite ${{ matrix.suite }} --engine ${{ matrix.engine }} \
            --reps "$REPS" --out "$out" "${extra[@]}" 2>&1 | tee "$out/measure.log"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: measure-${{ matrix.suite }}-${{ matrix.engine }}-${{ matrix.mode }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

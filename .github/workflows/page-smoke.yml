# Site smoke test: build dist-site, check its links, and load / and /analyze/ in headless Chromium, Firefox and WebKit.
# Job genome-step: the browser tests of step 1 of /analyze/ (validation/browser-page/tests/), one job per engine, on the same dist-site.
# Separate from page.yml so that a site change does not start the measurement jobs. No secrets.
name: Site smoke
on:
  push:
    branches: [page-v1]
    paths:
      - 'site/**'
      - 'scripts/build-site.sh'
      - 'crates/qrnamap-wasm/**'
      - 'validation/browser-page/smoke/**'
      - 'validation/browser-page/tests/**'
      - 'validation/browser-page/fixtures/**'
      - '.github/workflows/page-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: page-smoke-${{ github.ref }}
  cancel-in-progress: true

# Action versions are pinned to exact tags (the same tags as pages.yml and page.yml).
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          locked: true
          cache: true
      - run: pixi run build-wasm-web
      - run: bash scripts/build-site.sh
        env:
          SITE_CNAME: qrnamap.fungalgenomes.org
      # Uploaded before the smoke test, so a smoke failure in one engine does not stop the genome-step jobs.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-site
          path: dist-site
          include-hidden-files: true
          retention-days: 3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: validation/browser-page/smoke/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: validation/browser-page/smoke
      - name: Link checker tests
        run: node --test validation/browser-page/smoke/check-links.test.mjs
      - name: Link test on dist-site
        run: node validation/browser-page/smoke/check-links.mjs "$PWD/dist-site"
      - name: Install the Playwright browsers
        working-directory: validation/browser-page/smoke
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser smoke test
        run: node validation/browser-page/smoke/smoke.mjs "$PWD/dist-site"

  genome-step:
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist-site
          path: dist-site
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: validation/browser-page/tests/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: validation/browser-page/tests
      - name: Install the Playwright browser
        working-directory: validation/browser-page/tests
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Genome step tests (${{ matrix.engine }})
        run: node --test validation/browser-page/tests/genome.test.mjs
        env:
          DIST: ${{ github.workspace }}/dist-site
          ENGINE: ${{ matrix.engine }}

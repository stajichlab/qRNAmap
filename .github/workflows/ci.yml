name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QRNAMAP_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
      - name: Test
        run: pixi run test
      - name: WASM check
        run: pixi run wasm-check
      - name: Vendor check
        run: |
          bash scripts/check-vendor.sh "$PWD/site/vendor/kallisto"
          bash scripts/test-check-vendor.sh
      - name: DESeq2 reference scripts (dumper, prior table)
        run: RSCRIPT="$(pixi run bash -c 'command -v Rscript' | tail -1)" bash validation/de/test_deseq2_dump.sh

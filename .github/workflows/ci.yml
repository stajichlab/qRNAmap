name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QRNAMAP_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
      - name: Test
        run: pixi run test
      - name: WASM check
        run: pixi run wasm-check

# Desktop app on Linux: the apps/desktop tests with a real kallisto, then the built app driven end to end under xvfb
# (validation/desktop/e2e-webdriver.mjs: Tauri bridge and native kallisto, the genome step through the page, native quant).
# ubuntu-22.04 is the runner of the Linux release build (desktop-release.yml); ubuntu-24.04 has a newer WebKitGTK.
# kallisto 0.52.0 comes from the pixi environment. Reads: the first 1,000,000 pairs of yeast SRR3396381 from the public
# release page-v1-test-data-v1 (SHA-256 checked by quant-memory-reads.sh). Network: NCBI (genome) and the S3 index mirror.
# No secrets.
name: Desktop (Linux)
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'site/**'
      - 'scripts/build-site.sh'
      - 'crates/qrnamap-core/**'
      - 'crates/qrnamap-cli/**'
      - 'crates/qrnamap-wasm/**'
      - 'validation/desktop/**'
      - '.github/workflows/desktop-linux.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'site/**'
      - 'scripts/build-site.sh'
      - 'crates/qrnamap-core/**'
      - 'crates/qrnamap-cli/**'
      - 'crates/qrnamap-wasm/**'
      - 'validation/desktop/**'
      - '.github/workflows/desktop-linux.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

# Action versions are pinned to the same tags as the other workflows.
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: System libraries (WebKitGTK, WebKitWebDriver, xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          locked: true
          cache: true
      - run: pixi run build-wasm-web
      - run: bash scripts/build-site.sh
      # The desktop app is a workspace of its own, built with the runner's Rust (not pixi's), against the system WebKitGTK.
      - uses: dtolnay/rust-toolchain@stable
      - name: Record the tools
        run: |
          echo "QRNAMAP_KALLISTO=$PWD/.pixi/envs/default/bin/kallisto" >> "$GITHUB_ENV"
          "$PWD/.pixi/envs/default/bin/kallisto" version
          pkg-config --modversion webkit2gtk-4.1
          rustc --version
      - name: Desktop tests (kallisto required)
        working-directory: apps/desktop
        env:
          QRNAMAP_REQUIRE_TOOLS: '1'
        run: cargo test --release
      # tauri/custom-protocol is what `cargo tauri build` adds: the app serves dist-site from the binary, no dev server.
      - name: Build the app
        working-directory: apps/desktop
        run: cargo build --release --features tauri/custom-protocol
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.5'
      - name: Yeast reads (release asset, SHA-256 checked)
        timeout-minutes: 20
        run: bash validation/browser-page/tests/quant-memory-reads.sh "$RUNNER_TEMP/reads" yeast
      - name: End to end (xvfb)
        env:
          APP: ${{ github.workspace }}/apps/desktop/target/release/qrnamap-desktop
        shell: bash   # -eo pipefail: the exit status of the e2e, not of tee
        run: |
          xvfb-run -a -s "-screen 0 1280x900x24" \
            node validation/desktop/e2e-webdriver.mjs "$RUNNER_TEMP/reads/yeast_1.fastq.gz" "$RUNNER_TEMP/reads/yeast_2.fastq.gz" \
            2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e.log
          if-no-files-found: ignore
          retention-days: 14
